services:
  db:
    image: postgres:16-alpine
    container_name: pos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_user} -d ${POSTGRES_DB:-pos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./pos_be/pos_backend
      dockerfile: Dockerfile
    container_name: pos_backend
    restart: unless-stopped
    environment:
      # Core Django runtime settings.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-p0s-backend-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      CREATE_DJANGO_SUPERUSER: ${CREATE_DJANGO_SUPERUSER:-False}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_NAME: ${DJANGO_SUPERUSER_NAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}

      # DB_* are used when DATABASE_URL is not provided.
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-pos}
      DB_USER: ${DB_USER:-pos_user}
      DB_PASSWORD: ${DB_PASSWORD:-pos_password}
      # Default: dockerized postgres service. Override in .env for hosted DB.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      # Optional hosted DB (takes priority over DB_*):
      # postgresql://user:pass@host:5432/dbname?sslmode=require
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/static

  frontend:
    build:
      context: ./pos_fe
      dockerfile: Dockerfile
      args:
        # Keep "/" so frontend uses nginx reverse proxy to backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    container_name: pos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  # Named volumes persist data across container restarts.
  postgres_data:
  backend_media:
  backend_static:
